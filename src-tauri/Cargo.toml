[package]
name = "app"
version = "0.1.0"
description = "Minute — fully offline meeting notetaker"
authors = ["Muhammad"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
whisper-rs = { version = "0.16.0", features = ["metal"] }
cpal = "0.17.1"
hound = "3.5.1"
sha2 = "0.10.9"
thiserror = "2.0.19"
trash = "5.2.3"
sysinfo = "0.36.1"
reqwest = { version = "0.13.3", default-features = false, features = ["stream", "rustls"] }
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
