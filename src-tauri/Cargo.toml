[package]
name = "app"
version = "1.8.0"
description = "Minute — fully offline meeting notetaker"
authors = ["Muhammad"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `macos-private-api` (Stage 5 Task 2): required by `tauri-nspanel` (the
# meeting-detected popup's non-activating NSPanel — see popup.rs's module
# docs) and by this crate's own `tauri.conf.json`'s `macOSPrivateApi: true`
# (`transparent: true` on the popup window needs it — see that config
# field's own doc comment in tauri's config schema). `tauri-build`'s build
# script cross-checks the two at compile time (`tauri.conf.json`'s
# `macOSPrivateApi` flag against this literal feature list) and fails the
# build if they disagree, which is also why this has to live on this base
# entry rather than only under the macOS-only target-dependency table below
# (Cargo itself unions features fine either way, but tauri-build's own
# check apparently doesn't look there). Not actually a cross-platform
# concern in practice — this app only ships for macOS (see Info.plist/the
# bundled Metal frameworks) — so keeping it unconditional here is honest,
# not a compromise.
tauri = { version = "2.11.3", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "2"
whisper-rs = { version = "0.16.0", features = ["metal", "log_backend"] }
llama-cpp-2 = { version = "0.1.152", default-features = false, features = ["metal", "dynamic-link"] }
cpal = "0.17.1"
hound = "3.5.1"
sha2 = "0.10.9"
thiserror = "2.0.19"
trash = "5.2.3"
sysinfo = "0.36.1"
reqwest = { version = "0.13.3", default-features = false, features = ["stream", "rustls"] }
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "rt", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# Speaker diarization (issue #6, diar.rs): the *official* k2-fsa Rust API
# (the third-party `sherpa-rs` wrapper was archived 2026-06 in its favor).
# Default features link the prebuilt static sherpa-onnx/onnxruntime libs —
# no cmake at build time, no new dylibs in the bundle (verified via
# otool -L in the spike; only OS dylibs), ~15 MB stripped binary delta.
sherpa-onnx = "1.13.4"

# Meeting detection (Stage 5 Task 1): mic-in-use + running-app checks, both
# permission-free on macOS. `cargo tree -i coreaudio-sys` (checked before
# adding these) turns up *no* `coreaudio-sys` anywhere in the tree — cpal's
# macOS backend depends on `coreaudio-rs`, which as of its 0.14 line binds
# CoreAudio through `objc2-core-audio` (the same modern, safer objc2-based
# framework binding used here), not the classic C `coreaudio-sys` crate the
# plan assumed. So instead of pinning a crate that isn't actually anywhere
# in the tree, `objc2-core-audio` is pinned directly at the exact version
# already resolved transitively (`=0.3.2`, matching Cargo.lock) — same
# rationale as the plan's "pin the transitive dep" ask (never float on a
# transitive resolution), just against the crate that's actually there.
# `objc2`/`objc2-app-kit` are pinned the same way (`=0.6.4`/`=0.3.2`,
# already present transitively via `tauri`'s own macOS tray/menu support).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = [
  "AVCaptureDevice",
  "AVMediaFormat",
  "block2",
] }
objc2-core-audio = "=0.3.2"

# Echo cancellation (issue #15, vpio.rs): mic capture through the
# VoiceProcessingIO audio unit when system audio is in the mix. cpal's
# CoreAudio backend can't ask for that unit type, so vpio.rs drops one
# level down to `coreaudio-rs` — the crate cpal itself is built on, pinned
# at the exact version already resolved transitively (matching Cargo.lock,
# same "pin what's already there" rationale as the objc2-* pins above).
# `objc2-audio-toolbox` is coreaudio-rs's own binding layer (also already
# in the tree), needed directly for the AudioUnit property constants.
coreaudio-rs = "=0.14.2"
objc2-audio-toolbox = "=0.3.2"

# Stage 5 Task 2: the meeting-detected pill's non-activating NSPanel — see
# popup.rs's module docs for the tauri-apps/tauri #11488/#5566 rationale.
# Not published to crates.io — confirmed directly against the crates.io API
# before adding it (no `tauri-nspanel` crate exists there); upstream ships
# it as a git-only crate instead. Pinned to an exact commit on its `v2.1`
# branch (the one built against Tauri 2 — the older `v2` branch predates
# it; there are no tagged releases to pin to instead) rather than floating
# on the branch HEAD, the same "never float on a moving target" rule this
# block's other pinned dependencies already follow.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

# Stage 5 Task 4: system-audio capture (ScreenCaptureKit), via objc2's own
# header-generated framework bindings — NOT the `screencapturekit` crate
# (Swift-Package-Manager-based; reverted — its build script requires a full
# Xcode.app to compile at all, which broke `cargo build`/`cargo test` on any
# machine with only Command Line Tools installed, verified on this machine).
# `objc2-screen-capture-kit` and friends below are plain Objective-C header
# bindings (same shape as the already-present `objc2-app-kit`/
# `objc2-core-audio`) — no Swift toolchain involved at all, confirmed by a
# clean `cargo build` here with only Command Line Tools. All pinned exact at
# `=0.3.2`, matching the rest of the objc2-* family in this file.
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "SCStream",
  "SCShareableContent",
  "block2",
  "dispatch2",
  "objc2-core-media",
] }
# CMSampleBuffer + the audio_buffer_list_with_retained_block_buffer accessor
# `syscap.rs`'s capture callback uses to pull raw audio bytes out of what
# `SCStreamOutput` delivers.
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2",
  "CMBase",
  "CMSampleBuffer",
  "CMBlockBuffer",
  "objc2-core-audio-types",
  "block2",
] }
# The classic Core Audio `AudioBufferList`/`AudioBuffer` C structs
# `CMSampleBuffer::audio_buffer_list_with_retained_block_buffer` fills in —
# already resolved transitively at this exact version via `cpal`/
# `objc2-core-audio` (Task 1), same "pin what's already there" rationale as
# every other entry in this file.
objc2-core-audio-types = "=0.3.2"
# `CFRetained` — RAII ownership of the `+1`-retained `CMBlockBuffer` that
# `CMSampleBufferGetAudioBufferListWithRetainedBlockBuffer` hands back (see
# `syscap.rs::extract_audio_buffers`'s doc comment for why a non-null,
# retained block buffer turned out to be required, not optional, for that
# call to succeed at all). Already resolved transitively via
# `objc2-core-media`; pinned the same way as every other entry here.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
# `block2::RcBlock` — building the completion-handler blocks the async SCK
# APIs (`getShareableContentWithCompletionHandler`/`startCaptureWithCompletionHandler`/
# `stopCaptureWithCompletionHandler`) require. Already resolved transitively
# at this exact version via the crates above.
block2 = "=0.6.2"
# `CGPreflightScreenCaptureAccess`/`CGRequestScreenCaptureAccess` (the Screen
# Recording TCC check/request pair, predating ScreenCaptureKit itself —
# available since macOS 10.15, safe to call unconditionally on this crate's
# whole 11.0 floor) live in this crate's `CGWindow` module. Pinned the same
# "already-resolved transitive version" way as the Task 1 objc2-* crates
# above (`cargo tree -i objc2-core-graphics` shows `=0.3.2` already in the
# tree via `objc2-app-kit`).
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGWindow"] }
# `NSProcessInfo.operatingSystemVersion` — the macOS-13+ runtime gate for
# system-audio capture (see `syscap.rs::macos_major_version`), rather than
# parsing `sw_vers` output. Already resolved transitively at `=0.3.2` (via
# `cpal`/`tauri-nspanel`) — same "pin what's already there" rationale as
# every other objc2-* entry in this file. `features = ["std", "NSProcessInfo"]`:
# `std` is required unconditionally by this crate's own `lib.rs` (verified by
# a local build — omitting it is a hard compile error, not just unused code);
# `NSProcessInfo` gates the one type this crate actually calls into. Note:
# `syscap.rs`'s `mod capture` also uses `NSArray`/`NSError`/`NSString` (empty
# window array, completion-handler error formatting, bundle-id/description
# `.to_string()`) without listing those features here — they're already
# unconditionally pulled in by `objc2-screen-capture-kit`'s own `SCStream`/
# `SCShareableContent` features above (Cargo unifies a crate's features
# across the whole dependency graph), confirmed by the crate's own
# `Cargo.toml`. If those SCK features are ever narrowed, this entry would
# need `"NSArray"`/`"NSError"`/`"NSString"` added explicitly.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# llama-cpp-2 0.1.152's own Cargo.toml depends on llama-cpp-sys-2 without
# `default-features = false`, so sys-2's default "common" feature (which
# links OpenSSL by absolute Homebrew path — non-portable, breaks the
# bundle) stays on unconditionally no matter what features/default-features
# we pick on llama-cpp-2 here; `cargo tree -e features -i llama-cpp-sys-2`
# confirms it. vendor/llama-cpp-2-0.1.152 is that same crate with just the
# two llama-cpp-sys-2 dependency blocks given `default-features = false` —
# nothing else changed. Drop this patch if a future llama-cpp-2 release
# fixes it upstream.
#
# (Stage 5 Task 4 no longer needs a patch here: the `screencapturekit`/
# `apple-metal` Swift-based crates and their vendor patches were reverted —
# see `build.rs`'s weak-link comment for where that concern lives now that
# system audio uses plain objc2 framework bindings instead.)
[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2-0.1.152" }
