[package]
name = "app"
version = "0.1.0"
description = "Minute — fully offline meeting notetaker"
authors = ["Muhammad"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `macos-private-api` (Stage 5 Task 2): required by `tauri-nspanel` (the
# meeting-detected popup's non-activating NSPanel — see popup.rs's module
# docs) and by this crate's own `tauri.conf.json`'s `macOSPrivateApi: true`
# (`transparent: true` on the popup window needs it — see that config
# field's own doc comment in tauri's config schema). `tauri-build`'s build
# script cross-checks the two at compile time (`tauri.conf.json`'s
# `macOSPrivateApi` flag against this literal feature list) and fails the
# build if they disagree, which is also why this has to live on this base
# entry rather than only under the macOS-only target-dependency table below
# (Cargo itself unions features fine either way, but tauri-build's own
# check apparently doesn't look there). Not actually a cross-platform
# concern in practice — this app only ships for macOS (see Info.plist/the
# bundled Metal frameworks) — so keeping it unconditional here is honest,
# not a compromise.
tauri = { version = "2.11.3", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "2"
whisper-rs = { version = "0.16.0", features = ["metal", "log_backend"] }
llama-cpp-2 = { version = "0.1.152", default-features = false, features = ["metal", "dynamic-link"] }
cpal = "0.17.1"
hound = "3.5.1"
sha2 = "0.10.9"
thiserror = "2.0.19"
trash = "5.2.3"
sysinfo = "0.36.1"
reqwest = { version = "0.13.3", default-features = false, features = ["stream", "rustls"] }
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "rt", "time"] }

# Meeting detection (Stage 5 Task 1): mic-in-use + running-app checks, both
# permission-free on macOS. `cargo tree -i coreaudio-sys` (checked before
# adding these) turns up *no* `coreaudio-sys` anywhere in the tree — cpal's
# macOS backend depends on `coreaudio-rs`, which as of its 0.14 line binds
# CoreAudio through `objc2-core-audio` (the same modern, safer objc2-based
# framework binding used here), not the classic C `coreaudio-sys` crate the
# plan assumed. So instead of pinning a crate that isn't actually anywhere
# in the tree, `objc2-core-audio` is pinned directly at the exact version
# already resolved transitively (`=0.3.2`, matching Cargo.lock) — same
# rationale as the plan's "pin the transitive dep" ask (never float on a
# transitive resolution), just against the crate that's actually there.
# `objc2`/`objc2-app-kit` are pinned the same way (`=0.6.4`/`=0.3.2`,
# already present transitively via `tauri`'s own macOS tray/menu support).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-core-audio = "=0.3.2"

# Stage 5 Task 2: the meeting-detected pill's non-activating NSPanel — see
# popup.rs's module docs for the tauri-apps/tauri #11488/#5566 rationale.
# Not published to crates.io — confirmed directly against the crates.io API
# before adding it (no `tauri-nspanel` crate exists there); upstream ships
# it as a git-only crate instead. Pinned to an exact commit on its `v2.1`
# branch (the one built against Tauri 2 — the older `v2` branch predates
# it; there are no tagged releases to pin to instead) rather than floating
# on the branch HEAD, the same "never float on a moving target" rule this
# block's other pinned dependencies already follow.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# llama-cpp-2 0.1.152's own Cargo.toml depends on llama-cpp-sys-2 without
# `default-features = false`, so sys-2's default "common" feature (which
# links OpenSSL by absolute Homebrew path — non-portable, breaks the
# bundle) stays on unconditionally no matter what features/default-features
# we pick on llama-cpp-2 here; `cargo tree -e features -i llama-cpp-sys-2`
# confirms it. vendor/llama-cpp-2-0.1.152 is that same crate with just the
# two llama-cpp-sys-2 dependency blocks given `default-features = false` —
# nothing else changed. Drop this patch if a future llama-cpp-2 release
# fixes it upstream.
[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2-0.1.152" }
