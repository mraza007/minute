name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npx agent-browser install
      - run: npm run test:visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-output
          path: |
            tests/visual/actual
            tests/visual/diff

  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Rust 1.100 moved build outputs to build/<pkg>/<hash>/out. llama-cpp-sys-2's
      # build script then hard-links its dylibs into a missing target/debug/build/deps.
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run test:rust
