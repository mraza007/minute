name: Ad-hoc private macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-private.*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run verify
      - name: Compile target and stage bundle frameworks
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"macOS":{"frameworks":[]}}}'
        run: |
          cargo build \
            --release \
            --target "${{ matrix.target }}"
          target="${{ matrix.target }}"
          TAURI_ENV_DEBUG=false \
            TAURI_ENV_TARGET_TRIPLE="$target" \
            TAURI_ENV_ARCH="${{ matrix.arch }}" \
            scripts/stage-frameworks.sh
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles app
        env:
          TAURI_ENV_DEBUG: "false"
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_ENV_ARCH: ${{ matrix.arch }}
      - name: Verify architecture and ad-hoc signature
        run: |
          expected_arch="${{ matrix.target }}"
          expected_arch="${expected_arch%%-*}"
          bash scripts/verify-macos-bundle.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Minute.app" \
            "$expected_arch"
      - name: Package private artifact and checksum
        run: |
          artifact="Minute-${{ matrix.target }}-private.zip"
          ditto -c -k --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Minute.app" \
            "$artifact"
          shasum -a 256 "$artifact" > "$artifact.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: minute-${{ matrix.target }}-private
          path: |
            Minute-${{ matrix.target }}-private.zip
            Minute-${{ matrix.target }}-private.zip.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-private.')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach private builds to a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_version="${release_version%%-private.*}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Minute $release_version private build" \
              --prerelease \
              --notes "Ad-hoc signed Minute builds for private testing. Download the ZIP matching your Mac, verify its attached SHA-256 checksum, and follow the README's private-build installation steps. These builds are not Apple-notarized."
          fi
