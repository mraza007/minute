<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe9e2"/>
      <stop offset="100%" stop-color="#e3ded6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#paper)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" ry="182.5" fill="none" stroke="#1c1a18" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- mic stand: arc + stem + base (thick, chunky for legibility at 16px) -->
  <g fill="none" stroke="#1c1a18" stroke-width="44" stroke-linecap="round">
    <path d="M344,516 A168,168 0 0 0 680,516"/>
    <line x1="512" y1="684" x2="512" y2="776"/>
    <line x1="410" y1="776" x2="614" y2="776"/>
  </g>

  <!-- mic capsule -->
  <rect x="392" y="266" width="240" height="360" rx="120" fill="#1c1a18"/>

  <!-- recording indicator dot -->
  <circle cx="586" cy="312" r="32" fill="#e04430"/>
</svg>
