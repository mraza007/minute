<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Unlike index.html, this window is created with `transparent: true`
         (see src-tauri/src/popup.rs) — the pill itself carries the surface
         (--card/--border/shadow, see src/popup/Pill.tsx), so html/body stay
         fully transparent rather than painting --canvas the way index.html's
         own dark-flash guard does. A solid background here would paint a
         visible rectangle over the whole panel instead of just the
         rounded pill. -->
    <style>
      html, body { background: transparent; }
    </style>
    <title>Minute — meeting detected</title>
  </head>
  <body data-window="popup">
    <div id="root"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
