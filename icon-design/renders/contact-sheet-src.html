<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2200px; height:900px; overflow:hidden; }
  .sheet { width:2200px; height:900px; display:flex; }
  .half { width:1100px; height:900px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px; }
  .light { background:#e8e6e3; }
  .dark { background:#201e1c; }
  .title { font-family:-apple-system, "Helvetica Neue", Arial, sans-serif; font-size:26px; font-weight:700; }
  .light .title { color:#1c1a18; }
  .dark .title { color:#efe9e2; }
  .row { display:flex; gap:40px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:18px; }
  .col img { width:300px; height:300px; display:block; }
  .label { font-family:-apple-system, "Helvetica Neue", Arial, sans-serif; font-size:22px; font-weight:600; letter-spacing:0.02em; }
  .light .label { color:#1c1a18; }
  .dark .label { color:#efe9e2; }
</style>
</head>
<body>
<div class="sheet">
  <div class="half light">
    <div class="title">Minute — icon concepts (light)</div>
    <div class="row">
      <div class="col">
        <img src="waveform-m-1024.png">
        <div class="label">waveform-m</div>
      </div>
      <div class="col">
        <img src="ink-mic-1024.png">
        <div class="label">ink-mic</div>
      </div>
      <div class="col">
        <img src="timestamp-quote-1024.png">
        <div class="label">timestamp-quote</div>
      </div>
    </div>
  </div>
  <div class="half dark">
    <div class="title">on dark dock</div>
    <div class="row">
      <div class="col">
        <img src="waveform-m-1024.png">
        <div class="label">waveform-m</div>
      </div>
      <div class="col">
        <img src="ink-mic-1024.png">
        <div class="label">ink-mic</div>
      </div>
      <div class="col">
        <img src="timestamp-quote-1024.png">
        <div class="label">timestamp-quote</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
