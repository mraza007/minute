<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `<meta name="color-scheme">` here, deliberately — this is the one
         difference from every other document in the app (index.html,
         popup.html, screenshot-app.html all declare it). This page's own
         dark variant is driven entirely by the explicit `html[data-theme]`
         attribute the inline script below sets (never `prefers-color-scheme`
         media matching), so the meta tag buys this document nothing — and
         confirmed (headless Chrome, same-origin nested iframe, both at
         `--force-device-scale-factor=2`) that declaring it here forces an
         opaque default canvas paint *behind the `?state=popup` pill's
         iframe*, defeating that iframe's own `background: transparent` and
         showing as a solid white rectangle around the pill. Isolated with a
         battery of minimal repros (a lime backdrop + a same-origin iframe
         set to transparent): removing just this meta tag from the outer
         page — nothing about the iframe or its content — was the one change
         that fixed it. -->
    <title>Minute — marketing capture frame</title>
    <style>
      /* Kept in step with src/index.css's ramp — the backdrop is one shade
         off the app's own --canvas so the window still separates from it,
         and the accent blob matches --accent exactly. */
      :root {
        --backdrop-base: #e3dac6;
        --blob-accent: rgba(200, 65, 42, 0.2);
        --blob-cream: rgba(250, 244, 230, 0.7);
        --blob-gray: rgba(150, 138, 112, 0.16);
        --window-border: rgba(33, 29, 24, 0.12);
      }
      html[data-theme='dark'] {
        --backdrop-base: #100e09;
        --blob-accent: rgba(224, 90, 66, 0.16);
        --blob-cream: rgba(90, 76, 54, 0.28);
        --blob-gray: rgba(70, 62, 50, 0.22);
        --window-border: rgba(240, 233, 219, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--backdrop-base);
      }

      /* Soft blurred-blob backdrop — warm paper light, not a SaaS gradient:
         see .impeccable.md's "paper, not glass" and the anti-references
         list (no purple/cyan glassmorphism). Blobs are plain absolutely-
         positioned divs, heavily blurred, well outside the window chrome so
         nothing sharp-edged shows through. */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        pointer-events: none;
      }
      .blob-accent {
        width: 900px;
        height: 900px;
        top: -280px;
        left: -220px;
        background: var(--blob-accent);
      }
      .blob-cream {
        width: 1000px;
        height: 1000px;
        bottom: -420px;
        right: -280px;
        background: var(--blob-cream);
      }
      .blob-gray {
        width: 760px;
        height: 760px;
        bottom: -320px;
        left: 220px;
        background: var(--blob-gray);
      }

      /* Barely-there grain so the blurred backdrop doesn't read as a flat
         digital gradient — a tiny repeating radial-gradient tile, very low
         opacity. */
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.035;
        background-image: radial-gradient(circle at 1px 1px, #000 1px, transparent 0);
        background-size: 3px 3px;
        pointer-events: none;
      }
      html[data-theme='dark'] .grain {
        opacity: 0.05;
        background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
      }

      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .window-chrome {
        position: relative;
        width: 1440px;
        height: 820px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--window-border);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 8px 24px rgba(0, 0, 0, 0.14),
          0 25px 80px rgba(0, 0, 0, 0.25);
      }

      .window-chrome iframe {
        display: block;
        width: 1440px;
        height: 820px;
        border: none;
      }

      /* Fake traffic lights — the real app reserves 76px of left padding in
         its title bar (see TitleBar.tsx's `padding: '0 16px 0 76px'`) for
         native macOS traffic lights, which only exist in the real windowed
         app (Tauri's overlay title bar draws them, not any DOM the harness
         can render). This overlay reproduces them at the same position so
         the capture looks like a real app window instead of a browser tab. */
      .traffic-lights {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 8px;
        z-index: 10;
        pointer-events: none;
      }
      .traffic-lights span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      }
      .traffic-lights .tl-close {
        background: #ff5f57;
      }
      .traffic-lights .tl-min {
        background: #febc2e;
      }
      .traffic-lights .tl-zoom {
        background: #28c840;
      }

      /* `?state=popup` marketing frame — the pill isn't an app window, it's
         a panel that floats over *whatever* the user's looking at (per
         popup.rs: top-center of the active display, non-activating). There's
         no real "app window" to depict behind it honestly, so this reuses
         the same paper-warm backdrop as the other six shots (keeps the set
         visually one family) plus a plain, unbranded glassy rectangle
         standing in for "some call window behind it" — no logos, no invented
         chrome. The pill is the subject of this shot, not the rectangle: it
         renders at 2x scale in the upper-middle of the frame (real marketing
         convention for a small transient UI element — see e.g. how OS
         vendors shoot notification/toast captures), and the fake call
         window behind it is shrunk, pushed into the lower half, and dimmed
         so it reads as "context this appeared over" rather than competing
         for attention. A soft vignette reinforces the same read. */
      body.state-popup .window-chrome,
      body.state-popup .traffic-lights {
        display: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 30%, transparent 32%, rgba(0, 0, 0, 0.18) 100%);
      }
      html[data-theme='dark'] .vignette {
        background: radial-gradient(ellipse at 50% 30%, transparent 28%, rgba(0, 0, 0, 0.44) 100%);
      }
      /* Deliberately smaller than the other shots' `.window-chrome`, parked
         in the lower half only (its top edge starts past the frame's
         vertical center) and dimmed via `opacity` — background context for
         "a call was happening", never mistaken for the actual subject. */
      .desktop-window {
        position: absolute;
        top: 58%;
        left: 50%;
        transform: translate(-50%, 0%);
        width: 860px;
        height: 480px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.3);
        border: 1px solid var(--window-border);
        opacity: 0.5;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 16px 48px rgba(0, 0, 0, 0.14);
      }
      html[data-theme='dark'] .desktop-window {
        background: rgba(255, 255, 255, 0.04);
        opacity: 0.6;
      }
      /* Sized to the pill's real natural footprint (Pill.tsx: 470x72 plus
         its own 8px outer margin on every side = 486x88 — see Pill.tsx's
         width comment for why 470, not the plan's original 380) so nothing
         clips, then scaled 2x from its top edge to sit large and prominent
         in the upper-middle of the frame. `transform-origin: top center`
         keeps the scale expanding downward from a fixed top anchor instead
         of also pushing the top edge upward, which made the vertical
         placement fiddly to reason about. */
      .pill-frame-wrap {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%) scale(2);
        transform-origin: top center;
        width: 486px;
        height: 88px;
        filter: drop-shadow(0 26px 52px rgba(0, 0, 0, 0.34));
      }
      .pill-frame-wrap iframe {
        display: block;
        width: 486px;
        height: 88px;
        border: none;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="blob blob-accent"></div>
    <div class="blob blob-cream"></div>
    <div class="blob blob-gray"></div>
    <div class="grain"></div>
    <div class="stage">
      <div class="window-chrome">
        <div class="traffic-lights">
          <span class="tl-close"></span>
          <span class="tl-min"></span>
          <span class="tl-zoom"></span>
        </div>
        <iframe id="app-frame" title="Minute"></iframe>
      </div>
      <div class="desktop-window" id="desktop-window" hidden></div>
      <div class="vignette" id="vignette" hidden></div>
      <div class="pill-frame-wrap" id="pill-frame-wrap" hidden>
        <iframe id="pill-frame" title="Minute — meeting detected"></iframe>
      </div>
    </div>
    <script>
      // Forwards every query param this page was loaded with straight to
      // the app iframe (?state=…&theme=…&focus=…) and flips the backdrop's
      // own dark variant in lockstep — kept as one param rather than a
      // separate marketing-frame theme so a single URL always drives both
      // consistently.
      var params = new URLSearchParams(window.location.search)
      if (params.get('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
      var qs = params.toString()
      if (params.get('state') === 'popup') {
        document.body.classList.add('state-popup')
        document.getElementById('desktop-window').hidden = false
        document.getElementById('vignette').hidden = false
        document.getElementById('pill-frame-wrap').hidden = false
        document.getElementById('pill-frame').src = '/screenshot-app.html?' + qs
      } else {
        document.getElementById('app-frame').src = '/screenshot-app.html?' + qs
      }
    </script>
  </body>
</html>
