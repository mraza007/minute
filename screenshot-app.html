<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Minute — screenshot harness</title>
    <style>
      /* Fills whatever box the outer screenshot.html iframe gives it
         (1440×820 logical px) so App's own `height: 100vh` root div
         resolves against *this* document's viewport, not the marketing
         page's — see src/screenshot/darkOverride.ts's docs for why this
         file exists separately from screenshot.html at all. */
      html,
      body {
        margin: 0;
        height: 100%;
      }

      /* CI runners can be configured to reserve layout space for classic
         scrollbars while developer Macs use overlay scrollbars. That host
         preference shifted columns and text wrapping despite identical app
         CSS. Captures exercise scrolling semantically in browser tests; the
         regression image itself hides the host chrome so its geometry stays
         deterministic across both environments. */
      * {
        scrollbar-width: none;
      }

      *::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/screenshot/main.tsx"></script>
  </body>
</html>
